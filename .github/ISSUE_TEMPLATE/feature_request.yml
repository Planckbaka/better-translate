name: 💡 功能建议
description: 提议一个新功能或改进
title: '[Feature] '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        欢迎提议！描述清楚「要解决的问题」比「具体方案」更重要——方案我们可以在讨论区慢慢碰撞。
        大的改动建议先开 Issue 对齐方向再动手写代码。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 使用场景
      description: 你在什么场景下遇到了什么不便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，或其他工具是如何处理的？

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查清单
      options:
        - label: 我已确认该功能不在[路线图](https://github.com/Planckbaka/better-translate#%EF%B8%8F-路线图)的已有条目中（若在，欢迎在对应 Issue 下补充场景）
        - label: 我愿意协助实现或测试这个功能（可选）
