name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read
  statuses: write

jobs:
  semantic:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      # Dependabot 的标题由机器生成（"Bump ..."），无法遵循 Conventional Commits，跳过校验
      - if: github.actor != 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            标题的 subject 不应以大写字母开头（示例：feat(providers): 支持 Gemini 原生协议）。
